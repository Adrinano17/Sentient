<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Picture Pop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0 }
        body {
            height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            background: linear-gradient(180deg, #0c1221 0%, #071024 100%);
            color: #e6eef6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px
        }
        .game-wrap {
            width: 900px;
            max-width: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(2,6,23,.6);
            display: grid;
            grid-template-columns: 1fr 340px;
            overflow: hidden
        }
        .play-area {
            position: relative;
            background: linear-gradient(180deg, #092037 0%, #06202b 100%);
            min-height: 520px
        }
        .hud {
            position: absolute;
            left: 12px;
            top: 12px;
            display: flex;
            gap: 8px
        }
        .pill {
            background: rgba(255,255,255,.04);
            padding: 8px 12px;
            border-radius: 999px;
            font-weight: 600;
            color: #9aa4b2;
            backdrop-filter: blur(4px)
        }
        .score { font-size: 22px; color: #fff }
        .sidebar {
            padding: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,.015), rgba(255,255,255,.01));
            border-left: 1px solid rgba(255,255,255,.03)
        }
        h1 { font-size: 20px; margin-bottom: 8px }
        .controls { display: flex; gap: 8px; margin: 12px 0 }
        button {
            background: #ff6b6b;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .2s
        }
        button:hover { opacity: .9 }
        button:disabled { opacity: .5; cursor: not-allowed }
        button.secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,.06);
            color: #9aa4b2
        }
        .meta { color: #9aa4b2; font-size: 13px; line-height: 1.5 }
        .picture {
            position: absolute;
            cursor: pointer;
            transform-origin: center bottom;
            transition: transform .1s
        }
        .picture:hover { transform: scale(1.05) }
        .picture img { display: block; width: 100%; height: auto; border-radius: 8px }
        .pop {
            position: absolute;
            pointer-events: none;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,.6);
            transition: all .65s ease-out
        }
        @media (max-width:880px) {
            .game-wrap { grid-template-columns: 1fr }
            .sidebar { order: 2 }
        }
    </style>
</head>
<body>
    <div class="game-wrap">
        <div class="play-area" id="area">
            <div class="hud">
                <div class="pill score">Score: <span id="score">0</span></div>
                <div class="pill">Time: <span id="time">60</span>s</div>
                <div class="pill">Lives: <span id="lives">3</span></div>
            </div>
        </div>
        <aside class="sidebar">
            <h1>Picture Pop</h1>
            <p class="meta">Click the pictures before they float away!</p>
            <div class="controls">
                <button id="start">Start Game</button>
                <button class="secondary" id="reset">Reset Score</button>
            </div>
            <div class="pill" style="width:fit-content;margin-top:12px">High: <strong id="high">0</strong></div>
            <div class="meta" style="margin-top:18px">
                <strong>How to Play</strong><br>
                • Click pictures to pop them<br>
                • Don't let them escape (3 lives)<br>
                • Survive for 60 seconds
            </div>
            <div class="meta" style="margin-top:18px">Made with ❤️ — sentient fam</div>
        </aside>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const area = $('area'), scoreEl = $('score'), timeEl = $('time'), livesEl = $('lives');
        const startBtn = $('start'), resetBtn = $('reset'), highEl = $('high');

        const images = ['./images/dobby.png', './images/dobby1.png', './images/dobby2.jpeg', 
                       './images/dobby3.jpeg', './images/dobby4.jpeg', './images/dobby5.jpeg', './images/dobby6.jpeg'];

        let game = { score: 0, time: 60, lives: 3, running: false, intervals: [] };
        let high = parseInt(localStorage.getItem('high') || '0');
        highEl.textContent = high;

        const rand = (min, max) => Math.random() * (max - min) + min;

        function spawn() {
            const pic = document.createElement('div');
            pic.className = 'picture';
            const size = rand(50, 100);
            pic.style.width = size + 'px';
            pic.innerHTML = `<img src="${images[~~(Math.random() * images.length)]}">`;
            pic.style.left = rand(20, area.clientWidth - size - 20) + 'px';
            pic.style.bottom = '-140px';
            area.appendChild(pic);

            const speed = rand(2.2, 4.8), endY = area.clientHeight + 200;
            const start = performance.now();
            let popped = false;

            function animate(now) {
                if (popped) return;
                const t = (now - start) / (speed * 1000);
                if (t >= 1) {
                    pic.remove();
                    if (game.running) lose();
                    return;
                }
                pic.style.bottom = (t * endY - 140) + 'px';
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            const pop = () => {
                if (!game.running || popped) return;
                popped = true;
                const pts = ~~(size / 10);
                const rect = pic.getBoundingClientRect(), areaRect = area.getBoundingClientRect();
                const fx = document.createElement('div');
                fx.className = 'pop';
                fx.textContent = '+' + pts;
                fx.style.left = (rect.left - areaRect.left + rect.width / 2 - 24) + 'px';
                fx.style.top = (rect.top - areaRect.top + 8) + 'px';
                area.appendChild(fx);
                setTimeout(() => { fx.style.transform = 'translateY(-30px)'; fx.style.opacity = '0' }, 10);
                setTimeout(() => fx.remove(), 700);
                pic.remove();
                game.score += pts;
                scoreEl.textContent = game.score;
            };

            pic.onclick = pop;
            pic.ontouchstart = e => { e.preventDefault(); pop() };
        }

        function lose() {
            game.lives--;
            livesEl.textContent = game.lives;
            if (game.lives <= 0) end();
        }

        function tick() {
            game.time--;
            timeEl.textContent = game.time;
            if (game.time % 10 === 0) adjustDifficulty();
            if (game.time <= 0) end();
        }

        function adjustDifficulty() {
            const delay = Math.max(500, 1400 - (60 - game.time) * 10);
            clearInterval(game.intervals[1]);
            game.intervals[1] = setInterval(spawn, delay);
        }

        function start() {
            if (game.running) return;
            game = { score: 0, time: 60, lives: 3, running: true, intervals: [] };
            scoreEl.textContent = 0;
            timeEl.textContent = 60;
            livesEl.textContent = 3;
            area.querySelectorAll('.picture').forEach(p => p.remove());
            game.intervals = [setInterval(tick, 1000), setInterval(spawn, 1200)];
            startBtn.textContent = 'Running...';
            startBtn.disabled = true;
        }

        function end() {
            game.running = false;
            game.intervals.forEach(clearInterval);
            startBtn.textContent = 'Start Game';
            startBtn.disabled = false;
            
            if (game.score > high) {
                high = game.score;
                localStorage.setItem('high', high);
                highEl.textContent = high;
                alert(`🎉 New Highscore!\nScore: ${game.score}`);
            } else {
                alert(`Game Over\nScore: ${game.score}`);
            }
        }

        startBtn.onclick = start;
        resetBtn.onclick = () => {
            if (confirm('Reset highscore?')) {
                localStorage.removeItem('high');
                high = 0;
                highEl.textContent = 0;
            }
        };
    </script>
</body>
</html>
